name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (zmq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libzmq3-dev libportaudio2

      - name: Install Python deps
        # Pi-only packages (lgpio, picamera2, adafruit-blinka, gpiozero, etc.)
        # won't install on Ubuntu runners — install best-effort then fall through.
        # The codebase gracefully degrades to simulation for missing hardware imports.
        run: |
          python -m pip install --upgrade pip
          # Install everything from requirements.txt, ignoring Pi-specific failures
          pip install -r requirements.txt || true
          # Force-install the packages that CI absolutely needs (may have been skipped above)
          pip install pytest numpy soundfile sounddevice fastapi httpx psutil ruamel.yaml pyzmq opencv-python-headless pyyaml

      - name: Pytest
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest tests/ -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff check (non-blocking warnings)
        run: ruff check src/ tests/ scripts/ || true
      - name: ruff format --check (non-blocking)
        run: ruff format --check src/ tests/ scripts/ || true
