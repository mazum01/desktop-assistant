# Desktop Assistant — core configuration.

clock_announcements:
  # Spoken time at :00 and :30 of every hour.
  # At the top of the hour a dad joke follows the time.
  # Set to false to silence completely.
  enabled: true

head_tracking:
  # Natural spring-damper servo tracking following detected faces.
  # Idle mode: slow random gaze when no face is visible.
  enabled: true
  face_tracking_enabled: true    # servo follows detected faces
  random_motion_enabled: true    # idle random gaze when no face visible
  person_seek_enabled: true      # pan toward detected person when no face locked
  fov_degrees: 100.0        # IMX708 wide horizontal field of view estimate
  dead_zone_frac: 0.06      # fraction of frame width ignored before tracking activates
  tracking_gain: 0.28       # fraction of Kalman-predicted face offset applied as servo target
  max_speed_deg_s: 120.0    # hard velocity cap (servo physical limit ~300°/s)
  invert_pan: false          # flip pan direction (set true if servo mount reverses left/right)
  # Kalman filter — smooths face centroid, estimates velocity, predicts ahead
  kalman_r: 400.0            # measurement noise variance (px²); higher = more smoothing
  kalman_q_pos: 1.0          # process noise, position
  kalman_q_vel: 50.0         # process noise, velocity (higher = tracks fast motion better)
  lookahead_s: 0.02          # predict face position this far ahead (seconds)
  # Minimum-jerk trajectory — replaces spring-damper for human-like motion profiles
  replan_threshold_deg: 2.0  # only replan trajectory when target shifts by this many degrees
  move_base_s: 0.18          # minimum trajectory duration (s)
  move_scale_s_per_deg: 0.012  # extra duration per degree of travel
  move_max_s: 0.60           # cap on trajectory duration (s)
  speaking_motion:
    # Gentle sinusoidal head nod while DA is speaking via TTS.
    enabled: true
    amplitude_deg: 1.5      # peak nod offset in degrees (reduce if too distracting)
    freq_hz: 2.5            # nod oscillation frequency

servo:
  # Enable/disable all servo motion (head pan).
  # When disabled the servo holds its current position; the web
  # dashboard and CLI can change this at runtime.
  enabled: true
  soft_min_deg: 135   # minimum logical angle the servo may travel to (1–360)
  soft_max_deg: 215   # maximum logical angle the servo may travel to (1–360)
  # DS3218 pulse calibration.  500–2500 µs covers the full 0°–270° physical
  # travel; through the 360/270 gear ratio this gives 0°–360° head rotation.
  # Narrow the range here only if the servo binds at the extremes.
  pulse_min_us: 10
  pulse_max_us: 2950

camera:
  # Capture resolution and frame rate for the primary (face-tracking) camera.
  # Lower resolution = higher frame rate. 640×480 @ 30 fps is a good balance
  # for face detection on the Raspberry Pi 5.
  width: 640
  height: 480
  framerate: 30
  # MJPEG stream resolution for the web UI (cam1 only).
  # Hailo face detection runs on the full capture resolution above; only the
  # web delivery is downscaled. Set to 0 to use the capture resolution.
  # When the user overrides capture resolution to 1920×1080 via GUI/CLI, the
  # web stream still delivers at this size (~3ms encode vs ~95ms at 1080p).
  stream_width: 640
  stream_height: 480
  # Software rotation applied to every frame before display and detection.
  # Valid range: 0–359. Common values: 0 (none), 90, 180, 270.
  # Multiples of 90 are lossless; other angles keep the same canvas size.
  # Persisted at runtime; change live with: da vision rotation <deg>
  rotation_deg: 0
  # Autofocus mode: continuous | auto | manual | off
  # continuous — camera tracks focus in real-time (recommended for desk use)
  # auto       — single AF sweep at startup, then locks
  # manual     — fixed lens_position in diopters (0=∞, 1.0=1m, 2.0=0.5m)
  af_mode: continuous

camera2:
  # Secondary CSI camera — raw view only (no detection/overlays).
  # Set enabled: false to disable the second stream entirely.
  enabled: true
  index: 1          # CSI slot 1
  width: 640
  height: 480
  framerate: 30     # match primary cam — Pi 5 handles dual 30fps comfortably
  rotation_deg: 0
  # Must match camera.af_mode so both feeds have consistent focus behaviour.
  af_mode: continuous

face_recognition:
  # ArcFace MobileFaceNet identity recognition on the Hailo-8.
  # New faces are auto-assigned "Guest N"; name them with: da meet "Name"
  enabled: true
  greeting_cooldown_min: 30       # base re-greet cooldown in minutes
  greeting_cooldown_jitter_pct: 25  # ± jitter percentage (e.g. 25 → 30 min ± 7.5 min)
  min_absence_s: 30               # face must have been absent this long before re-greeting
  confidence_threshold: 0.5       # minimum detection confidence to trigger a greeting

face_detection:
  # SCRFD face detection on the Hailo-8.
  # Higher max_fps = more responsive tracking but more GIL pressure on the
  # camera encoder thread. 5 fps is a good balance; the Kalman filter
  # predicts position between detections so tracking remains smooth.
  max_fps: 5.0

depth:
  # Depth estimation for face localisation in 3D space.
  # Two methods are fused: face-size (always on) + stereo (when cam2 is enabled).
  #
  # Face-size method: uses the known average frontal face width and the camera
  # focal length (derived from camera.fov_degrees + camera.width) to estimate Z.
  # Accurate to ±15% for frontal faces at 0.3–4 m. No calibration required.
  #
  # Stereo method: uses template matching between cam1 and cam2 to find the
  # horizontal disparity, then Z = focal_px × baseline_m / disparity_px.
  # Requires both cameras to be enabled and roughly horizontally aligned.
  enabled: true
  baseline_mm: 56               # physical horizontal separation between lenses
  known_face_width_m: 0.145     # assumed average frontal face width in metres
  min_depth_m: 0.25             # reject depth estimates below this threshold
  max_depth_m: 6.0              # reject depth estimates above this threshold

object_detection:
  # YOLOv8s object classification on the Hailo-8.
  # Detects 80 COCO classes (person, laptop, cup, etc.) at ~2 fps.
  # Can be toggled at runtime from the web dashboard or CLI.
  enabled: true
  max_fps: 2.0              # inference rate; lower = less Hailo contention with face detection
  conf_threshold: 0.40      # minimum detection confidence
  max_objects: 8            # max objects sent to overlay per frame (sorted by confidence)

web_dashboard:
  # Live browser dashboard served on the local network.
  # Access at http://<pi-ip>:8080
  enabled: true
  port: 8080
  host: "0.0.0.0"

quiet_hours:
  # Silence the assistant during these hours.
  # start/end are 24-hour HH:MM strings; overnight ranges work (e.g. 21:00–06:00).
  # Can also be changed live from the web dashboard.
  enabled: true
  start: "21:00"
  end: "06:00"

music:
  # Pandora playback via pianobar (https://github.com/PromyLOPh/pianobar).
  # Pre-requisite: sudo apt install pianobar
  # Then create ~/.config/pianobar/config:
  #   user = your@pandora.com
  #   password = yourpassword
  enabled: true
  announce_song_changes: false  # if true, speaks "Now playing…" on each new track

notifications:
  # Proactive speech: thermal alerts and long-absence check-ins.
  thermal_alerts:
    enabled: true
    warn_celsius: 75.0          # speak a warning at this temperature
    critical_celsius: 85.0      # speak a critical alert at this temperature
    min_interval_min: 10        # minimum minutes between repeated thermal notifications
  absence_alerts:
    enabled: true
    absence_min: 30             # minutes with no face seen before speaking
    min_interval_min: 60        # minimum minutes between repeated absence alerts
