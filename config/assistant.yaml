audio:
  backend: respeaker_flex
  default:
    eq_preset: bass_boost
    input_device_name: pipewire
    input_sample_rate: 16000
    input_source_match: reSpeaker
    loudness_boost: 2.5
    output_alsa_device: pulse
    output_sample_rate: 16000
  respeaker_flex:
    eq_preset: custom
    input_device_name: ReSpeaker
    input_processed_channel: 0
    input_processing_enabled: true
    input_raw_channels: 6
    input_raw_mic_channel: 1
    input_sample_rate: 16000
    led_enabled: false
    loudness_boost: 2.5
    output_alsa_device: pulse
    output_sample_rate: 16000
audio_capture:
  chunk_seconds: 0.08
  emit_spectrum: true
  spectrum_bins: 48
  vad_hang_s: 0.8
  vad_threshold_dbfs: -42.0
camera:
  af_mode: continuous
  framerate: 30
  height: 480
  rotation_deg: 0
  stream_height: 360
  stream_width: 640
  width: 640
camera2:
  af_mode: continuous
  enabled: true
  framerate: 30
  height: 1080
  index: 1
  rotation_deg: 0
  width: 1920
clock_announcements:
  enabled: true
depth:
  baseline_mm: 56
  block_size: 5
  dense_enabled: false
  dense_height: 480
  dense_rate_hz: 3.0
  dense_width: 640
  enabled: true
  known_face_width_m: 0.145
  max_depth_m: 6.0
  min_depth_m: 0.25
  mono_enabled: false
  mono_hef_path: /usr/local/hailo/resources/models/hailo8/scdepthv3.hef
  mono_rate_hz: 3.0
  num_disparities: 128
drop:
  alert_on_leak: true
  alert_on_salt_low: true
  mqtt_host: localhost
  mqtt_pass: ''
  mqtt_port: 1883
  mqtt_user: drop
  salt_alert_cooldown_s: 7200
face_recognition:
  confidence_threshold: 0.5
  enabled: true
  greeting_cooldown_jitter_pct: 25
  greeting_cooldown_min: 30
  guest_intro_delay_min: 2.0
  match_threshold: 0.6
  max_fps: 5.0
  min_absence_s: 30
  min_face_px: 80
head_tracking:
  dead_zone_frac: 0.06
  enabled: true
  face_tracking_enabled: true
  fov_degrees: 100.0
  invert_pan: false
  kalman_q_pos: 1.0
  kalman_q_vel: 50.0
  kalman_r: 400.0
  lookahead_s: 0.02
  max_speed_deg_s: 120.0
  move_base_s: 0.18
  move_max_s: 0.6
  move_scale_s_per_deg: 0.012
  person_seek_enabled: true
  random_motion_enabled: true
  replan_threshold_deg: 2.0
  speaking_motion:
    amplitude_deg: 1.5
    enabled: true
    freq_hz: 2.5
  tracking_gain: 0.28
music:
  announce_song_changes: false
  enabled: true
notifications:
  absence_alerts:
    absence_min: 30
    enabled: true
    min_interval_min: 60
  thermal_alerts:
    critical_celsius: 85.0
    enabled: true
    min_interval_min: 10
    warn_celsius: 75.0
object_detection:
  conf_threshold: 0.4
  enabled: true
  max_fps: 2.0
  max_objects: 8
privacy:
  announce: false
  announce_text: I'll give you some privacy.
  clear_frames: 4
  cooldown_s: 5.0
  enabled: true
  idle_rate_hz: 0.25
  look_away_angle_deg: 45
  person_hold_s: 8.0
  rate_hz: 1.0
  require_person: true
  resume_text: Are you decent?
  threshold: 0.7
quiet_hours:
  enabled: true
  end: 06:00
  start: '21:00'
radon:
  alert_on_red: true
  poll_interval_s: 300
  red_alert_cooldown_s: 3600
  telegram_alert_cooldown_s: 7200
  telegram_alert_pcil: 1.5
room_detection:
  consec_diverged: 3
  low_light_thresh: 15.0
  prompt_cooldown_s: 1800
  sample_interval_s: 600
  similarity_thresh: 0.85
  skip_when_faces: true
servo:
  enabled: true
  pulse_max_us: 2950
  pulse_min_us: 10
  soft_max_deg: 215
  soft_min_deg: 135
telegram:
  bot_token: ''
  chat_id: ''
  emoji_named: 🏷️
  emoji_new_face: 👋
  emoji_returning: 👤
  enabled: true
  forward_tts: true
  tts_skip_patterns:
  - It is now
  - The time is
tts:
  output_gain: 1.1
  piper_length_scale: 1.15
  piper_noise_scale: 0.3
  piper_noise_w: 0.5
  piper_voice_name: en_US-lessac-medium
watchdog:
  check_interval_s: 30
  enabled: true
  openclaw_max_uptime_min: 90
  openclaw_stuck_threshold: 10
  restart_cooldown_min: 5
  telegram_notify: false
web_dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8080
