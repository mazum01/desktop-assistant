    duty: 10.0
  - temp_c: 51.0
    duty: 20.0
  - temp_c: 65.0
    duty: 70.0
  - temp_c: 75.0
    duty: 100.0
  poll_interval_s: 1.0
  spin_up_duty: 60.0
  spin_up_duration_s: 3.0
