temp_blend:
  # Weighted average of case ambient (TMP117) and CPU die temperature.
  # Weights are normalised to sum to 1.0 at runtime.
  case_weight: 0.2   # TMP117 sensor on I²C (ambient / case temp)
  cpu_weight:  0.8   # Pi SoC die (/sys/class/thermal/thermal_zone0/temp)

fan:
  pwm_chip: 0
  pwm_channel: 1
  pwm_period_ns: 40000
  fallback_gpio: 13
  fallback_freq_hz: 10000
tach:
  enabled: true
  gpio: 6
  pulses_per_rev: 2
  publish_interval_s: 1.0
thresholds:
  safe_max_c: 55.0
  warn_max_c: 65.0
  critical_c: 75.0
  fan_min_duty: 0.0
  fan_max_duty: 100.0
  control_points:
  - temp_c: 50.0
    duty: 0.0
  - temp_c: 55.0
    duty: 20.0
  - temp_c: 65.0
    duty: 70.0
  - temp_c: 75.0
    duty: 100.0
  poll_interval_s: 1.0
