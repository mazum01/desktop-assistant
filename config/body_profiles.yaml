original:
  revision: 2
  servo:
    pan_channel: 15
    range_deg: 360
    pulse_min_us: 500
    pulse_max_us: 2500
    soft_min_deg: 135
    soft_max_deg: 215
    tilt_channel: 1
    tilt_enabled: false
  head_tracking:
    controller: legacy
    invert_pan: false
    invert_tilt: false
    dead_zone_frac: 0.08
new:
  servo:
    pan_channel: 1
    range_deg: 180
    pulse_min_us: 500
    pulse_max_us: 2500
    soft_min_deg: 70
    soft_max_deg: 110
    tilt_channel: 0
    tilt_enabled: true
    tilt_min_deg: 70
    tilt_max_deg: 110
  head_tracking:
    controller: gaze
    # Measured on the IMX708 standard lens at 1920x1080 (pan/tilt sweep with
    # image phase correlation). The 100° default made image offsets ~1.6x too
    # large, which caused overshoot and fixation jitter.
    fov_degrees: 72.0
    vertical_fov_degrees: 49.0
    invert_pan: true
    invert_tilt: false
    dead_zone_frac: 0.02
    # Head starts a small chin lift before the first speech after cooldown_s of
    # silence; audio waits lead_s for it.
    pre_speech:
      lead_s: 0.25
      lift_deg: 2.0
      relax_s: 0.6
      cooldown_s: 60.0   # quiet time before the gesture can repeat
      sway_s: 1.5        # brief sway after onset; none on follow-up sentences
    gaze:
      servo_lag_s: 0.06
      max_predict_s: 0.4
      pursuit_min_deg_s: 3.0
      max_pursuit_deg_s: 60.0
      reacquire_jump_deg: 15.0
      lost_s: 1.0
      saccade_min_deg: 8.0
      saccade_gain: 0.9
      settle_pan_deg: 3.0
      settle_tilt_deg: 2.0
      release_pan_deg: 6.0
      release_tilt_deg: 4.0
      pursuit_settle_s: 0.25
      pursuit_confidence: 2.0
      fixation_dwell_s: 0.3
