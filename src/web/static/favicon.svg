<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- background -->
  <rect width="100" height="100" rx="16" ry="16" fill="#222"/>
  <!-- head -->
  <rect x="15" y="25" width="70" height="55" rx="10" ry="10" fill="#b4bec8"/>
  <!-- antenna stem -->
  <rect x="47" y="16" width="6" height="10" fill="#788090"/>
  <!-- antenna ball -->
  <circle cx="50" cy="11" r="7" fill="#50d0ff"/>
  <!-- left eye -->
  <circle cx="34" cy="44" r="9" fill="#141414"/>
  <circle cx="34" cy="44" r="5" fill="#50d2ff"/>
  <!-- right eye -->
  <circle cx="66" cy="44" r="9" fill="#141414"/>
  <circle cx="66" cy="44" r="5" fill="#50d2ff"/>
  <!-- mouth -->
  <rect x="28" y="62" width="44" height="11" rx="4" ry="4" fill="#282828"/>
  <line x1="43" y1="62" x2="43" y2="73" stroke="#b4bec8" stroke-width="2"/>
  <line x1="57" y1="62" x2="57" y2="73" stroke="#b4bec8" stroke-width="2"/>
</svg>
